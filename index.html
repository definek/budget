<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F9FAFB">
<title>식당 창업예산 관리</title>
<style>
  :root {
    --blue: #3182F6;
    --blue-hover: #1B64DA;
    --blue-weak: #E8F3FF;
    --bg: #F9FAFB;
    --surface: #FFFFFF;
    --surface-sub: #F2F4F6;
    --text: #191F28;
    --text-2: #4E5968;
    --text-3: #8B95A1;
    --border: #E5E8EB;
    --border-strong: #D1D6DB;
    --red: #F04452;
    --red-weak: #FFEBEE;
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, .04);
    --shadow-md: 0 2px 8px rgba(0, 0, 0, .06), 0 1px 2px rgba(0, 0, 0, .04);
    --shadow-lg: 0 8px 24px rgba(0, 0, 0, .12);
    --r-sm: 8px;
    --r-md: 12px;
    --r-lg: 16px;
    --r-xl: 20px;
    --ease: cubic-bezier(.25, .46, .45, .94);
  }

  /* 시스템 설정을 따르되, 뷰어가 라이트를 명시하면 그 선택이 이긴다. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --blue: #4E93FF;
      --blue-hover: #6BA5FF;
      --blue-weak: #1B2A44;
      --bg: #17171C;
      --surface: #202027;
      --surface-sub: #2A2A32;
      --text: #F2F4F6;
      --text-2: #C9CDD2;
      --text-3: #8B95A1;
      --border: #33333D;
      --border-strong: #454550;
      --red: #FF6B76;
      --red-weak: #3A2226;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, .3);
      --shadow-md: 0 2px 8px rgba(0, 0, 0, .35);
      --shadow-lg: 0 8px 24px rgba(0, 0, 0, .5);
    }
  }

  /* 뷰어가 다크를 명시한 경우 (시스템 설정과 무관하게 적용) */
  :root[data-theme="dark"] {
    --blue: #4E93FF;
    --blue-hover: #6BA5FF;
    --blue-weak: #1B2A44;
    --bg: #17171C;
    --surface: #202027;
    --surface-sub: #2A2A32;
    --text: #F2F4F6;
    --text-2: #C9CDD2;
    --text-3: #8B95A1;
    --border: #33333D;
    --border-strong: #454550;
    --red: #FF6B76;
    --red-weak: #3A2226;
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, .3);
    --shadow-md: 0 2px 8px rgba(0, 0, 0, .35);
    --shadow-lg: 0 8px 24px rgba(0, 0, 0, .5);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    color-scheme: light dark;
  }

  body {
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
                 "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", system-ui, Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    letter-spacing: -0.01em;
  }

  button, input, select, textarea {
    font-family: inherit;
    font-size: inherit;
    letter-spacing: inherit;
    color: inherit;
  }

  button { cursor: pointer; border: none; background: none; padding: 0; }
  a { color: inherit; text-decoration: none; }

  .tabular { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

  /* ---------- Layout ---------- */
  .app {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 16px calc(48px + env(safe-area-inset-bottom));
  }

  .appbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 62px;
    padding: 14px 0 12px;
    background: var(--bg);
  }

  .appbar h1 {
    margin: 0;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.03em;
  }

  .appbar .sub {
    display: block;
    margin-top: 1px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-3);
    letter-spacing: -0.01em;
  }

  .back {
    display: grid;
    place-items: center;
    flex: none;
    width: 36px;
    height: 36px;
    margin-left: -8px;
    border-radius: 50%;
    color: var(--text);
    transition: background .15s var(--ease);
  }

  .back:hover { background: var(--surface-sub); }
  .back:active { background: var(--border); }

  .page[hidden] { display: none; }

  .card {
    background: var(--surface);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-md);
    padding: 20px;
    margin-bottom: 12px;
  }

  .section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin: 0 0 14px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .page-desc {
    margin: -2px 0 16px;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text-3);
    line-height: 1.55;
  }

  /* ---------- Hero summary ---------- */
  .hero { padding: 22px 20px; }

  .hero-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-3);
  }

  .hero-amount {
    margin-top: 6px;
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -0.045em;
    line-height: 1.15;
  }

  .hero-meta {
    margin-top: 4px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-3);
  }

  /* ---------- 페이지 이동 ---------- */
  .nav-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }

  .nav-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 16px;
    background: var(--surface);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-md);
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: -0.02em;
    transition: background .15s var(--ease), transform .1s var(--ease);
  }

  .nav-btn:hover { background: var(--surface-sub); }
  .nav-btn:active { transform: scale(.98); }
  .nav-btn svg { flex: none; color: var(--text-3); }

  /* ---------- Progress bar ---------- */
  .bar {
    height: 6px;
    margin-top: 8px;
    border-radius: 999px;
    background: var(--surface-sub);
    overflow: hidden;
  }

  .bar > span {
    display: block;
    height: 100%;
    border-radius: 999px;
    background: var(--blue);
    transition: width .5s var(--ease);
  }

  /* ---------- Form ---------- */
  .field { margin-bottom: 14px; }
  .field:last-of-type { margin-bottom: 0; }

  .field > label,
  .field-label {
    display: block;
    margin-bottom: 7px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-2);
  }

  .field-label .opt { color: var(--text-3); font-weight: 500; }

  input[type="text"],
  textarea {
    width: 100%;
    padding: 13px 14px;
    background: var(--surface-sub);
    border: 1px solid transparent;
    border-radius: var(--r-md);
    font-size: 15px;
    font-weight: 500;
    outline: none;
    transition: background .15s var(--ease), border-color .15s var(--ease), box-shadow .15s var(--ease);
    -webkit-appearance: none;
    appearance: none;
  }

  textarea { min-height: 76px; resize: vertical; line-height: 1.5; }

  input[type="text"]:focus, textarea:focus {
    background: var(--surface);
    border-color: var(--blue);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 18%, transparent);
  }

  input::placeholder, textarea::placeholder { color: var(--text-3); font-weight: 500; }

  /* ---------- 카테고리 선택 (체크박스형) ---------- */
  .cat-picker { display: flex; flex-wrap: wrap; gap: 8px; }

  .cat-pick {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 13px 9px 10px;
    background: var(--surface-sub);
    border: 1.5px solid transparent;
    border-radius: var(--r-md);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text-2);
    cursor: pointer;
    transition: background .15s var(--ease), border-color .15s var(--ease), color .15s var(--ease);
  }

  .cat-pick input {
    position: absolute;
    width: 1px; height: 1px;
    opacity: 0;
    pointer-events: none;
  }

  .cat-pick .box {
    display: grid;
    place-items: center;
    flex: none;
    width: 19px;
    height: 19px;
    background: var(--surface);
    border: 1.5px solid var(--border-strong);
    border-radius: 6px;
    transition: background .15s var(--ease), border-color .15s var(--ease);
  }

  .cat-pick .box svg { opacity: 0; transition: opacity .15s var(--ease); }
  .cat-pick:hover { background: var(--border); }

  .cat-pick.is-on {
    background: color-mix(in srgb, var(--c) 11%, transparent);
    border-color: var(--c);
    color: var(--text);
  }

  .cat-pick.is-on .box { background: var(--c); border-color: var(--c); }
  .cat-pick.is-on .box svg { opacity: 1; }
  .cat-pick:focus-within { box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 25%, transparent); }

  /* ---------- 단가 · 수량 ---------- */
  .money-wrap { position: relative; }

  .money-wrap > span {
    position: absolute;
    top: 50%;
    left: 14px;
    transform: translateY(-50%);
    font-size: 15px;
    font-weight: 700;
    color: var(--text-3);
    pointer-events: none;
  }

  .money-wrap input {
    padding-left: 32px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .amount-quick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

  .chip-mini {
    padding: 6px 10px;
    background: var(--surface-sub);
    border-radius: var(--r-sm);
    font-size: 12px;
    font-weight: 600;
    color: var(--text-2);
    transition: background .15s var(--ease), transform .1s var(--ease);
  }

  .chip-mini:hover { background: var(--border); }
  .chip-mini:active { transform: scale(.94); }

  .qty {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px;
    background: var(--surface-sub);
    border: 1px solid transparent;
    border-radius: var(--r-md);
    transition: border-color .15s var(--ease), background .15s var(--ease);
  }

  .qty:focus-within {
    background: var(--surface);
    border-color: var(--blue);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 18%, transparent);
  }

  .qty button {
    display: grid;
    place-items: center;
    flex: none;
    width: 38px;
    height: 38px;
    background: var(--surface);
    border-radius: var(--r-sm);
    box-shadow: var(--shadow-sm);
    font-size: 19px;
    font-weight: 700;
    color: var(--text-2);
    transition: background .15s var(--ease), transform .1s var(--ease), opacity .15s var(--ease);
  }

  .qty button:hover { background: var(--border); }
  .qty button:active { transform: scale(.92); }
  .qty button:disabled { opacity: .35; cursor: not-allowed; transform: none; }

  .qty input {
    flex: 1;
    min-width: 0;
    width: 100%;
    padding: 0;
    background: none;
    border: none;
    outline: none;
    text-align: center;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .total-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 14px;
    padding: 15px 16px;
    background: var(--blue-weak);
    border-radius: var(--r-md);
  }

  .total-row .lbl { font-size: 13.5px; font-weight: 600; color: var(--text-2); }

  .total-row .val {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.035em;
    color: var(--blue);
  }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 14px 18px;
    border-radius: var(--r-md);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.02em;
    transition: background .15s var(--ease), transform .1s var(--ease), opacity .15s var(--ease);
  }

  .btn[hidden] { display: none; }
  .btn:active { transform: scale(.98); }
  .btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  .btn-primary { background: var(--blue); color: #fff; }
  .btn-primary:hover { background: var(--blue-hover); }

  .btn-sub { background: var(--surface-sub); color: var(--text-2); }
  .btn-sub:hover { background: var(--border); }

  .btn-danger { background: var(--red); color: #fff; }
  .btn-danger:hover { filter: brightness(1.05); }

  .btn-ghost {
    padding: 8px 10px;
    border-radius: var(--r-sm);
    font-size: 13px;
    font-weight: 600;
    color: var(--text-3);
    transition: background .15s var(--ease), color .15s var(--ease);
  }

  .btn-ghost:hover { background: var(--surface-sub); color: var(--text-2); }
  .btn-ghost.danger:hover { background: var(--red-weak); color: var(--red); }

  .form-actions { display: flex; gap: 8px; margin-top: 18px; }
  .form-actions .btn { flex: 1; }

  /* ---------- Filter chips ---------- */
  .filters {
    display: flex;
    gap: 6px;
    margin: 0 -16px 12px;
    padding: 2px 16px 8px;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .filters::-webkit-scrollbar { display: none; }

  .chip {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-2);
    white-space: nowrap;
    transition: background .15s var(--ease), border-color .15s var(--ease), color .15s var(--ease), transform .1s var(--ease);
  }

  .chip:hover { border-color: var(--border-strong); }
  .chip:active { transform: scale(.96); }

  .chip.active { background: var(--blue); border-color: var(--blue); color: #fff; }
  .chip.active .dot { background: #fff !important; }

  /* ---------- Expense list ---------- */
  .list { display: flex; flex-direction: column; }

  .item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
    animation: fadeUp .3s var(--ease) both;
  }

  .item:last-child { border-bottom: none; padding-bottom: 0; }
  .item:first-child { padding-top: 0; }

  .item.editing {
    background: var(--blue-weak);
    margin: 0 -12px;
    padding: 14px 12px;
    border-radius: var(--r-md);
    border-bottom-color: transparent;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: none; }
  }

  .item-main { flex: 1; min-width: 0; }

  .item-title {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.02em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .item-meta {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 5px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-3);
  }

  .dot {
    flex: none;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--blue);
  }

  .tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 8px;
    background: var(--surface-sub);
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-2);
  }

  .tag .dot { width: 6px; height: 6px; }

  .item-memo {
    margin-top: 6px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-3);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .item-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }

  .item-amount {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.025em;
    white-space: nowrap;
  }

  .item-actions { display: flex; gap: 2px; }

  .empty { padding: 44px 20px; text-align: center; color: var(--text-3); }
  .empty .big { font-size: 30px; }

  .empty .msg {
    margin-top: 10px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-2);
  }

  .empty .hint { margin-top: 4px; font-size: 13px; font-weight: 500; }

  /* ---------- 카테고리별 합계 페이지 ---------- */
  .tot-row { padding: 13px 0; border-bottom: 1px solid var(--border); }
  .tot-row:first-child { padding-top: 0; }
  .tot-row:last-child { border-bottom: none; padding-bottom: 0; }

  .tot-head { display: flex; align-items: center; gap: 8px; }

  .tot-name {
    flex: 1;
    min-width: 0;
    font-size: 14px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .tot-amount { font-size: 15px; font-weight: 700; letter-spacing: -0.025em; }

  .tot-sub {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-top: 5px;
    padding-left: 16px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-3);
  }

  /* ---------- 카테고리 관리 페이지 ---------- */
  .cat-edit {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }

  .cat-edit:first-child { padding-top: 0; }
  .cat-edit:last-child { border-bottom: none; }

  .cat-edit .name-input {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    font-size: 14px;
    font-weight: 600;
  }

  .cat-edit .cnt {
    flex: none;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-3);
    white-space: nowrap;
  }

  .swatch {
    flex: none;
    width: 32px;
    height: 32px;
    padding: 0;
    background: none;
    border: none;
    border-radius: 9px;
    cursor: pointer;
    transition: transform .1s var(--ease);
  }

  .swatch:active { transform: scale(.9); }
  .swatch::-webkit-color-swatch-wrapper { padding: 0; }
  .swatch::-webkit-color-swatch { border: 1px solid rgba(0, 0, 0, .1); border-radius: 9px; }
  .swatch::-moz-color-swatch { border: 1px solid rgba(0, 0, 0, .1); border-radius: 9px; }

  .add-cat { display: flex; gap: 8px; margin-top: 16px; }
  .add-cat input { flex: 1; }
  .add-cat .btn { flex: none; padding: 13px 18px; }

  .data-actions { display: flex; gap: 8px; }
  .data-actions .btn { flex: 1; }

  /* ---------- Modal ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    background: rgba(0, 0, 0, .45);
    animation: fade .2s var(--ease);
  }

  .overlay[hidden] { display: none; }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }

  .sheet {
    width: 100%;
    max-width: 400px;
    padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
    background: var(--surface);
    border-radius: var(--r-xl) var(--r-xl) 0 0;
    box-shadow: var(--shadow-lg);
    animation: slideUp .28s var(--ease);
  }

  @media (min-width: 600px) {
    .overlay { align-items: center; padding: 20px; }
    .sheet { border-radius: var(--r-xl); }
  }

  .sheet h2 {
    margin: 0 0 4px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.03em;
  }

  .sheet p.desc {
    margin: 0 0 20px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-2);
    line-height: 1.55;
  }

  .sheet-actions { display: flex; gap: 8px; margin-top: 22px; }
  .sheet-actions .btn { flex: 1; }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(28px + env(safe-area-inset-bottom));
    z-index: 90;
    transform: translate(-50%, 12px);
    max-width: calc(100vw - 40px);
    padding: 13px 20px;
    background: var(--text);
    color: var(--bg);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-lg);
    font-size: 14px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s var(--ease), transform .22s var(--ease);
  }

  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>

<div class="app">

  <!-- ===================== 홈 ===================== -->
  <div class="page" id="pageHome">

      <div class="hero-label">총 창업비용</div>
      <div class="hero-amount tabular" id="totalsPageAmount">₩0</div>

          <path d="M12 4.5L6.5 10L12 15.5" stroke="currentColor" stroke-width="1.9"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <h1>카테고리 관리</h1>
    </header>

    <section class="card">
      <h2 class="section-title">카테고리 목록</h2>
      <p class="page-desc">이름을 눌러 바로 수정하고, 왼쪽 색상 칩으로 색을 바꿀 수 있어요.</p>
      <div id="categoryEditList"></div>

      <form class="add-cat" id="addCategoryForm">
        <input type="text" id="newCategoryName" placeholder="새 카테고리 이름" maxlength="20" autocomplete="off">
        <button type="submit" class="btn btn-primary">추가</button>

    <section class="card">
      <h2 class="section-title">데이터 백업</h2>
      <p class="page-desc">내보낸 JSON 파일로 언제든 데이터를 되돌릴 수 있어요.</p>
      <div class="data-actions">
        <button type="button" class="btn btn-sub" id="btnExport">JSON 내보내기</button>
        <button type="button" class="btn btn-sub" id="btnImport">JSON 불러오기</button>

<!-- 확인 다이얼로그 -->
<div class="overlay" id="confirmModal" hidden>
  <div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle">
    <h2 id="confirmTitle">삭제할까요?</h2>
    <p class="desc" id="confirmDesc">이 작업은 되돌릴 수 없어요.</p>
    <div class="sheet-actions">
      <button type="button" class="btn btn-sub" id="btnConfirmCancel">취소</button>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* =========================================================
     데이터 (JSON 구조 + localStorage)
     ========================================================= */
  var STORAGE_KEY = 'restaurant-startup-budget-v1';

  var DEFAULT_CATEGORY_NAMES = [
    '임차보증금/권리금',
    '인테리어비',
    '주방기기·설비비',
    '가구·집기비',
    '초도 식자재비',
    '인허가·등록비',
    '오픈 마케팅비',
    '예비비'
  ];

  // input[type=color]가 소문자 표기를 돌려주므로 팔레트도 소문자로 맞춘다.
  var PALETTE = ['#3182f6', '#15c39a', '#7b61ff', '#ff8a00', '#f76099', '#4c6ef5', '#2fb344', '#f04452'];

  var MAX_AMOUNT = 999999999999;
  var MAX_QTY = 9999;
  var MAX_NAME = 20;

  var state = { categories: [], expenses: [] };
  var editingId = null;
  var activeFilter = 'all';
  var selectedCategoryId = null;
  var confirmHandler = null;

  function uid(prefix) {
    return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function defaultData() {
    return {
      categories: DEFAULT_CATEGORY_NAMES.map(function (name, i) {
        return { id: uid('cat'), name: name, color: PALETTE[i % PALETTE.length] };
      }),
      expenses: []
    };
  }

  function isHexColor(value) {
    return typeof value === 'string' && /^#[0-9a-fA-F]{6}$/.test(value);
  }

  function clampInt(value, min, max, fallback) {
    var n = Number(value);
    if (!isFinite(n)) return fallback;
    n = Math.round(n);
    if (n < min) return fallback;
    return Math.min(n, max);
  }

  // 외부 JSON(localStorage · 불러오기)을 신뢰하지 않고 항상 검증해서 사용한다.
  function normalizeData(parsed) {
    if (!parsed || typeof parsed !== 'object') throw new Error('올바른 JSON 형식이 아닙니다.');

    var data = { categories: [], expenses: [] };

    if (Array.isArray(parsed.categories)) {
      parsed.categories.forEach(function (c, i) {
        if (!c || typeof c.name !== 'string') return;
        data.categories.push({
          id: typeof c.id === 'string' && c.id ? c.id : uid('cat'),
          name: c.name.slice(0, MAX_NAME),
          color: isHexColor(c.color) ? c.color.toLowerCase() : PALETTE[i % PALETTE.length]
        });
      });
    }
    if (!data.categories.length) data.categories = defaultData().categories;

    if (Array.isArray(parsed.expenses)) {
      var validIds = {};
      data.categories.forEach(function (c) { validIds[c.id] = true; });

      parsed.expenses.forEach(function (e) {
        if (!e || typeof e !== 'object') return;

        var quantity = clampInt(e.quantity, 1, MAX_QTY, 1);
        var unitPrice = clampInt(e.unitPrice, 0, MAX_AMOUNT, -1);

        // 단가·수량이 없던 이전 형식은 amount를 단가로 보고 수량 1로 옮긴다.
        if (unitPrice < 0) {
          unitPrice = clampInt(e.amount, 0, MAX_AMOUNT, 0);
          quantity = 1;
        }

        data.expenses.push({
          id: typeof e.id === 'string' && e.id ? e.id : uid('exp'),
          categoryId: validIds[e.categoryId] ? e.categoryId : data.categories[0].id,
          title: typeof e.title === 'string' ? e.title : '',
          unitPrice: unitPrice,
          quantity: quantity,
          amount: Math.min(unitPrice * quantity, MAX_AMOUNT),
          memo: typeof e.memo === 'string' ? e.memo : ''
        });
      });
    }
    return data;
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultData();
      return normalizeData(JSON.parse(raw));
    } catch (err) {
      console.warn('저장된 데이터를 읽지 못했습니다.', err);
      return defaultData();
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (err) {
      toast('저장 공간이 부족해 저장하지 못했어요');
    }
  }

  /* =========================================================
     유틸
     ========================================================= */
  function comma(n) {
    return Math.round(Number(n) || 0).toLocaleString('ko-KR');
  }

  function won(n) { return '₩' + comma(n); }

  function parseAmount(str) {
    var digits = String(str).replace(/[^\d]/g, '');
    if (!digits) return 0;
    return Math.min(parseInt(digits, 10), MAX_AMOUNT);
  }

  function esc(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function categoryById(id) {
    return state.categories.filter(function (c) { return c.id === id; })[0] || null;
  }

  function categoryColor(id) {
    var cat = categoryById(id);
    return cat ? cat.color : '#8B95A1';
  }

  function totalsByCategory() {
    var map = {};
    state.categories.forEach(function (c) { map[c.id] = 0; });
    state.expenses.forEach(function (e) {
      if (map[e.categoryId] === undefined) map[e.categoryId] = 0;
      map[e.categoryId] += e.amount;
    });
    return map;
  }

  function countsByCategory() {
    var map = {};
    state.expenses.forEach(function (e) {
      map[e.categoryId] = (map[e.categoryId] || 0) + 1;
    });
    return map;
  }

  function grandTotal() {
    return state.expenses.reduce(function (sum, e) { return sum + e.amount; }, 0);
  }

  var toastTimer = null;
  function toast(message) {
    var el = document.getElementById('toast');
    el.textContent = message;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2000);
  }

  /* =========================================================
     페이지 전환 (해시 라우팅 · 브라우저 뒤로가기 지원)
     ========================================================= */
  var PAGES = {
    '#/totals': 'pageTotals',
    '#/categories': 'pageCategories'
  };

  function currentPageId() {
    return PAGES[location.hash] || 'pageHome';
  }

  function showPage() {
    var active = currentPageId();
    ['pageHome', 'pageTotals', 'pageCategories'].forEach(function (id) {
      document.getElementById(id).hidden = id !== active;
    });

    // 페이지에 들어올 때마다 최신 값으로 다시 그린다.
    if (active === 'pageTotals') renderCategoryTotals();
    if (active === 'pageCategories') renderCategoryEditList();

    window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', showPage);

  /* =========================================================
     렌더링
     ========================================================= */
  function renderAll() {
    renderSummary();
    renderCategoryPicker();
    renderFilters();
    renderList();
    if (currentPageId() === 'pageTotals') renderCategoryTotals();
    if (currentPageId() === 'pageCategories') renderCategoryEditList();
  }

  function renderSummary() {
    var total = won(grandTotal());
    var meta = '내역 ' + state.expenses.length + '건 · 카테고리 ' + state.categories.length + '개';

    document.getElementById('totalAmount').textContent = total;
    document.getElementById('totalMeta').textContent = meta;
    document.getElementById('totalsPageAmount').textContent = total;
    document.getElementById('totalsPageMeta').textContent = meta;
  }

  function renderCategoryPicker() {
    var picker = document.getElementById('categoryPicker');

    if (!state.categories.length) {
      picker.innerHTML = '<div style="font-size:13px;font-weight:500;color:var(--text-3);">' +
        '카테고리 관리에서 카테고리를 먼저 추가해 주세요</div>';
      selectedCategoryId = null;
      return;
    }

    if (!categoryById(selectedCategoryId)) selectedCategoryId = state.categories[0].id;

    picker.innerHTML = state.categories.map(function (c) {
      var on = c.id === selectedCategoryId;
      return '<label class="cat-pick' + (on ? ' is-on' : '') + '" style="--c:' + esc(c.color) + '">' +
          '<input type="radio" name="categoryPick" value="' + esc(c.id) + '"' + (on ? ' checked' : '') + '>' +
          '<span class="box" aria-hidden="true">' +
            '<svg width="11" height="11" viewBox="0 0 12 12" fill="none">' +
              '<path d="M2.5 6.2L4.8 8.5L9.5 3.8" stroke="#fff" stroke-width="2" ' +
              'stroke-linecap="round" stroke-linejoin="round"/>' +
            '</svg>' +
          '</span>' +
          esc(c.name) +
        '</label>';
    }).join('');

    picker.querySelectorAll('input[name="categoryPick"]').forEach(function (input) {
      input.addEventListener('change', function () {
        selectedCategoryId = input.value;
        renderCategoryPicker();
      });
    });
  }

  function renderFilters() {
    var counts = countsByCategory();

    var html = '<button type="button" class="chip' + (activeFilter === 'all' ? ' active' : '') +
      '" data-f="all">전체 ' + state.expenses.length + '</button>';

    html += state.categories.map(function (c) {
      if (!counts[c.id]) return '';
      return '<button type="button" class="chip' + (activeFilter === c.id ? ' active' : '') +
        '" data-f="' + esc(c.id) + '">' +
        '<i class="dot" style="background:' + esc(c.color) + '"></i>' +
        esc(c.name) + ' ' + counts[c.id] + '</button>';
    }).join('');

    var filters = document.getElementById('filters');
    filters.innerHTML = html;
    filters.querySelectorAll('[data-f]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        activeFilter = btn.getAttribute('data-f');
        renderFilters();
        renderList();
      });
    });
  }

  function renderList() {
    var listEl = document.getElementById('expenseList');
    var items = state.expenses.slice();

    if (activeFilter !== 'all') {
      items = items.filter(function (e) { return e.categoryId === activeFilter; });
    }

    items.reverse(); // 최근 등록순

    var filterTotal = items.reduce(function (s, e) { return s + e.amount; }, 0);
    document.getElementById('listCount').textContent = items.length + '건 · ' + won(filterTotal);

    if (!items.length) {
      listEl.innerHTML = '<div class="empty">' +
        '<div class="big">🧾</div>' +
        '<div class="msg">' +
          (state.expenses.length ? '이 카테고리엔 내역이 없어요' : '아직 등록된 내역이 없어요') +
        '</div>' +
        '<div class="hint">위 폼에서 첫 창업비용을 기록해 보세요</div>' +
        '</div>';
      return;
    }

    listEl.innerHTML = items.map(function (e) {
      var cat = categoryById(e.categoryId);
      return '<div class="item' + (editingId === e.id ? ' editing' : '') + '">' +
          '<div class="item-main">' +
            '<div class="item-title">' + esc(e.title) + '</div>' +
            '<div class="item-meta">' +
              '<span class="tag"><i class="dot" style="background:' + esc(categoryColor(e.categoryId)) + '"></i>' +
                esc(cat ? cat.name : '미분류') + '</span>' +
              (e.quantity > 1
                ? '<span class="tabular">' + won(e.unitPrice) + ' × ' + comma(e.quantity) + '</span>'
                : '') +
            '</div>' +
            (e.memo ? '<div class="item-memo">' + esc(e.memo) + '</div>' : '') +
          '</div>' +
          '<div class="item-right">' +
            '<div class="item-amount tabular">' + won(e.amount) + '</div>' +
            '<div class="item-actions">' +
              '<button type="button" class="btn-ghost" data-edit="' + esc(e.id) + '">수정</button>' +
              '<button type="button" class="btn-ghost danger" data-del="' + esc(e.id) + '">삭제</button>' +
            '</div>' +
          '</div>' +
        '</div>';
    }).join('');

    listEl.querySelectorAll('[data-edit]').forEach(function (btn) {
      btn.addEventListener('click', function () { startEdit(btn.getAttribute('data-edit')); });
    });
    listEl.querySelectorAll('[data-del]').forEach(function (btn) {
      btn.addEventListener('click', function () { askDeleteExpense(btn.getAttribute('data-del')); });
    });
  }

  /* =========================================================
     카테고리별 합계 페이지
     ========================================================= */
  function renderCategoryTotals() {
    var wrap = document.getElementById('categoryTotals');
    var totals = totalsByCategory();
    var counts = countsByCategory();
    var total = grandTotal();

    if (!state.categories.length) {
      wrap.innerHTML = '<div class="empty"><div class="msg">카테고리가 없어요</div>' +
        '<div class="hint">카테고리 관리에서 추가해 주세요</div></div>';
      return;
    }

    var rows = state.categories.map(function (c) {
      return { cat: c, amount: totals[c.id] || 0, count: counts[c.id] || 0 };
    }).sort(function (a, b) { return b.amount - a.amount; });

    wrap.innerHTML = rows.map(function (r) {
      var share = total > 0 ? r.amount / total * 100 : 0;
      return '<div class="tot-row">' +
          '<div class="tot-head">' +
            '<i class="dot" style="background:' + esc(r.cat.color) + '"></i>' +
            '<span class="tot-name">' + esc(r.cat.name) + '</span>' +
            '<span class="tot-amount tabular">' + won(r.amount) + '</span>' +
          '</div>' +
          '<div class="bar"><span style="width:' + share + '%;background:' + esc(r.cat.color) + '"></span></div>' +
          '<div class="tot-sub">' +
            '<span>' + r.count + '건</span>' +
            '<span>전체의 ' + share.toFixed(1) + '%</span>' +
          '</div>' +
        '</div>';
    }).join('');
  }

  /* =========================================================
     내역 CRUD
     ========================================================= */
  var form = document.getElementById('expenseForm');
  var fTitle = document.getElementById('fTitle');
  var fUnitPrice = document.getElementById('fUnitPrice');
  var fQty = document.getElementById('fQty');
  var fMemo = document.getElementById('fMemo');

  function currentQty() {
    var digits = fQty.value.replace(/[^\d]/g, '');
    if (!digits) return 0;
    return Math.min(parseInt(digits, 10), MAX_QTY);
  }

  function refreshTotal() {
    var total = Math.min(parseAmount(fUnitPrice.value) * Math.max(currentQty(), 0), MAX_AMOUNT);
    document.getElementById('fTotal').textContent = won(total);
    document.getElementById('qtyMinus').disabled = currentQty() <= 1;
  }

  fUnitPrice.addEventListener('input', function () {
    var value = parseAmount(fUnitPrice.value);
    fUnitPrice.value = value ? comma(value) : '';
    refreshTotal();
  });

  fQty.addEventListener('input', function () {
    var digits = fQty.value.replace(/[^\d]/g, '');
    fQty.value = digits ? String(Math.min(parseInt(digits, 10), MAX_QTY)) : '';
    refreshTotal();
  });

  fQty.addEventListener('blur', function () {
    if (currentQty() < 1) fQty.value = '1';
    refreshTotal();
  });

  document.querySelectorAll('[data-step]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var next = currentQty() + Number(btn.getAttribute('data-step'));
      fQty.value = String(Math.min(Math.max(next, 1), MAX_QTY));
      refreshTotal();
    });
  });

  document.querySelectorAll('[data-add]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var add = Number(btn.getAttribute('data-add'));
      fUnitPrice.value = add === 0 ? '' : comma(parseAmount(fUnitPrice.value) + add);
      refreshTotal();
      fUnitPrice.focus();
    });
  });

  form.addEventListener('submit', function (event) {
    event.preventDefault();

    if (!state.categories.length) {
      toast('먼저 카테고리를 추가해 주세요');
      return;
    }

    var title = fTitle.value.trim();
    var unitPrice = parseAmount(fUnitPrice.value);
    var quantity = currentQty();

    if (!categoryById(selectedCategoryId)) { toast('카테고리를 선택해 주세요'); return; }
    if (!title) { toast('항목명을 입력해 주세요'); fTitle.focus(); return; }
    if (unitPrice <= 0) { toast('단가를 입력해 주세요'); fUnitPrice.focus(); return; }
    if (quantity < 1) { toast('수량은 1 이상이어야 해요'); fQty.focus(); return; }

    var amount = Math.min(unitPrice * quantity, MAX_AMOUNT);

    if (editingId) {
      var target = state.expenses.filter(function (e) { return e.id === editingId; })[0];
      if (target) {
        target.categoryId = selectedCategoryId;
        target.title = title;
        target.unitPrice = unitPrice;
        target.quantity = quantity;
        target.amount = amount;
        target.memo = fMemo.value.trim();
      }
      toast('수정했어요');
    } else {
      state.expenses.push({
        id: uid('exp'),
        categoryId: selectedCategoryId,
        title: title,
        unitPrice: unitPrice,
        quantity: quantity,
        amount: amount,
        memo: fMemo.value.trim()
      });
      toast('내역을 추가했어요');
    }

    save();
    resetForm();
    renderAll();
  });

  function startEdit(id) {
    var target = state.expenses.filter(function (e) { return e.id === id; })[0];
    if (!target) return;

    editingId = id;
    selectedCategoryId = target.categoryId;
    fTitle.value = target.title;
    fUnitPrice.value = comma(target.unitPrice);
    fQty.value = String(target.quantity);
    fMemo.value = target.memo || '';
    refreshTotal();

    document.getElementById('formTitle').textContent = '내역 수정';
    document.getElementById('btnSubmit').textContent = '수정 완료';
    document.getElementById('btnCancelEdit').hidden = false;

    renderCategoryPicker();
    renderList();
    form.scrollIntoView({ behavior: 'smooth', block: 'center' });
    fTitle.focus({ preventScroll: true });
  }

  function resetForm() {
    editingId = null;
    form.reset();
    fQty.value = '1';
    refreshTotal();
    document.getElementById('formTitle').textContent = '내역 추가';
    document.getElementById('btnSubmit').textContent = '추가하기';
    document.getElementById('btnCancelEdit').hidden = true;
    renderCategoryPicker(); // 마지막에 고른 카테고리는 그대로 유지된다.
  }

  document.getElementById('btnCancelEdit').addEventListener('click', function () {
    resetForm();
    renderList();
  });

  function askDeleteExpense(id) {
    var target = state.expenses.filter(function (e) { return e.id === id; })[0];
    if (!target) return;

    openConfirm(
      '내역을 삭제할까요?',
      '‘' + target.title + '’ ' + won(target.amount) + ' 내역이 삭제돼요. 되돌릴 수 없어요.',
      function () {
        state.expenses = state.expenses.filter(function (e) { return e.id !== id; });
        if (editingId === id) resetForm();
        save();
        renderAll();
        toast('삭제했어요');
      }
    );
  }

  /* =========================================================
     카테고리 관리 페이지
     ========================================================= */
  function renderCategoryEditList() {
    var wrap = document.getElementById('categoryEditList');
    var counts = countsByCategory();

    if (!state.categories.length) {
      wrap.innerHTML = '<div class="empty" style="padding:24px 0;">' +
        '<div class="msg">카테고리가 없어요</div>' +
        '<div class="hint">아래에서 새 카테고리를 추가해 주세요</div></div>';
      return;
    }

    wrap.innerHTML = state.categories.map(function (c) {
      return '<div class="cat-edit">' +
          '<input type="color" class="swatch" value="' + esc(c.color) + '" ' +
            'data-color="' + esc(c.id) + '" aria-label="' + esc(c.name) + ' 색상">' +
          '<input type="text" class="name-input" value="' + esc(c.name) + '" ' +
            'maxlength="' + MAX_NAME + '" autocomplete="off" ' +
            'data-name="' + esc(c.id) + '" aria-label="카테고리 이름">' +
          (counts[c.id] ? '<span class="cnt">' + counts[c.id] + '건</span>' : '') +
          '<button type="button" class="btn-ghost danger" data-delcat="' + esc(c.id) + '">삭제</button>' +
        '</div>';
    }).join('');

    wrap.querySelectorAll('[data-color]').forEach(function (input) {
      input.addEventListener('input', function () {
        var cat = categoryById(input.getAttribute('data-color'));
        if (!cat || !isHexColor(input.value)) return;
        cat.color = input.value.toLowerCase();
        save();
        renderSummary();
        renderCategoryPicker();
        renderFilters();
        renderList();
      });
    });

    // 이름은 입력이 끝난 시점(blur/Enter)에 검증해서 반영한다.
    wrap.querySelectorAll('[data-name]').forEach(function (input) {
      input.addEventListener('change', function () { commitRename(input); });
      input.addEventListener('keydown', function (event) {
        if (event.key === 'Enter') { event.preventDefault(); input.blur(); }
        if (event.key === 'Escape') {
          var cat = categoryById(input.getAttribute('data-name'));
          if (cat) input.value = cat.name;
          input.blur();
        }
      });
    });

    wrap.querySelectorAll('[data-delcat]').forEach(function (btn) {
      btn.addEventListener('click', function () { askDeleteCategory(btn.getAttribute('data-delcat')); });
    });
  }

  function commitRename(input) {
    var cat = categoryById(input.getAttribute('data-name'));
    if (!cat) return;

    var name = input.value.trim().slice(0, MAX_NAME);

    if (!name) {
      input.value = cat.name;
      toast('카테고리 이름은 비울 수 없어요');
      return;
    }
    if (name === cat.name) {
      input.value = cat.name;
      return;
    }

    var dup = state.categories.some(function (c) { return c.id !== cat.id && c.name === name; });
    if (dup) {
      input.value = cat.name;
      toast('이미 있는 카테고리예요');
      return;
    }

    cat.name = name;
    input.value = name;
    save();
    renderSummary();
    renderCategoryPicker();
    renderFilters();
    renderList();
    toast('이름을 수정했어요');
  }

  document.getElementById('addCategoryForm').addEventListener('submit', function (event) {
    event.preventDefault();
    var input = document.getElementById('newCategoryName');
    var name = input.value.trim().slice(0, MAX_NAME);

    if (!name) { toast('카테고리 이름을 입력해 주세요'); return; }

    var dup = state.categories.some(function (c) { return c.name === name; });
    if (dup) { toast('이미 있는 카테고리예요'); return; }

    state.categories.push({
      id: uid('cat'),
      name: name,
      color: PALETTE[state.categories.length % PALETTE.length]
    });
    input.value = '';
    save();
    renderAll();
    renderCategoryEditList();
    toast('카테고리를 추가했어요');
  });

  function askDeleteCategory(id) {
    var cat = categoryById(id);
    if (!cat) return;

    var related = state.expenses.filter(function (e) { return e.categoryId === id; });
    var desc = related.length
      ? '‘' + cat.name + '’ 카테고리와 해당 내역 ' + related.length + '건(' +
        won(related.reduce(function (s, e) { return s + e.amount; }, 0)) + ')이 함께 삭제돼요.'
      : '‘' + cat.name + '’ 카테고리를 삭제해요.';

    openConfirm('카테고리를 삭제할까요?', desc, function () {
      state.categories = state.categories.filter(function (c) { return c.id !== id; });
      state.expenses = state.expenses.filter(function (e) { return e.categoryId !== id; });
      if (activeFilter === id) activeFilter = 'all';
      if (selectedCategoryId === id) selectedCategoryId = null;
      if (editingId && !state.expenses.some(function (e) { return e.id === editingId; })) resetForm();
      save();
      renderAll();
      renderCategoryEditList();
      toast('삭제했어요');
    });
  }

  /* =========================================================
     JSON 내보내기 · 불러오기
     ========================================================= */
  document.getElementById('btnExport').addEventListener('click', function () {
    var json = JSON.stringify(state, null, 2);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(json).then(function () {
        toast('JSON을 클립보드에 복사했어요');
      }, function () {
        console.log(json);
        toast('복사 실패 · 콘솔에 출력했어요');
      });
    } else {
      console.log(json);
      toast('콘솔에 JSON을 출력했어요');
    }
  });

  var fileInput = document.getElementById('fileInput');

  document.getElementById('btnImport').addEventListener('click', function () {
    fileInput.click();
  });

  fileInput.addEventListener('change', function () {
    var file = fileInput.files && fileInput.files[0];
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function () {
      var incoming;
      try {
        incoming = normalizeData(JSON.parse(String(reader.result)));
      } catch (err) {
        toast('읽을 수 없는 JSON 파일이에요');
        return;
      }

      openConfirm(
        '데이터를 불러올까요?',
        '카테고리 ' + incoming.categories.length + '개, 내역 ' + incoming.expenses.length + '건을 불러와요. ' +
        '지금 저장된 데이터는 모두 대체돼요.',
        function () {
          state = incoming;
          activeFilter = 'all';
          selectedCategoryId = null;
          save();
          resetForm();
          renderAll();
          renderCategoryEditList();
          toast('데이터를 불러왔어요');
        },
        '불러오기'
      );
    };
    reader.onerror = function () { toast('파일을 읽지 못했어요'); };
    reader.readAsText(file);
    fileInput.value = '';
  });

  /* =========================================================
     확인 다이얼로그
     ========================================================= */
  var confirmModal = document.getElementById('confirmModal');

  function openConfirm(title, desc, onOk, okLabel) {
    var okBtn = document.getElementById('btnConfirmOk');
    document.getElementById('confirmTitle').textContent = title;
    document.getElementById('confirmDesc').textContent = desc;
    okBtn.textContent = okLabel || '삭제';
    okBtn.classList.toggle('btn-danger', !okLabel);
    okBtn.classList.toggle('btn-primary', !!okLabel);
    confirmHandler = onOk;
    confirmModal.hidden = false;
    document.body.style.overflow = 'hidden';
    okBtn.focus();
  }

  function closeConfirm() {
    if (confirmModal.contains(document.activeElement)) document.activeElement.blur();
    confirmModal.hidden = true;
    document.body.style.overflow = '';
    confirmHandler = null;
  }

  document.getElementById('btnConfirmOk').addEventListener('click', function () {
    var handler = confirmHandler;
    closeConfirm();
    if (handler) handler();
  });
  document.getElementById('btnConfirmCancel').addEventListener('click', closeConfirm);
  confirmModal.addEventListener('click', function (event) {
    if (event.target === confirmModal) closeConfirm();
  });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && !confirmModal.hidden) closeConfirm();
  });

  /* =========================================================
     시작
     ========================================================= */
  state = load();
  resetForm();
  renderAll();
  showPage();
  save();
})();
</script>
</body>
</html>
